<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIOELLE | Luxury Brand</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2d3436;
            --accent-color: #a29bfe;
            --text-light: #636e72;
            --bg-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--primary-color); line-height: 1.6; }

        /* Header & Logo */
        header {
            background: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-container img {
            max-height: 60px; /* يمكنك تعديل حجم اللوغو من هنا */
            width: auto;
        }
        .logo-text { 
            font-size: 1.8rem; font-weight: 600; letter-spacing: 5px; 
            text-transform: uppercase; color: var(--primary-color); text-decoration: none;
        }

        /* Hero Section */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://s.alicdn.com/@sc04/kf/A31c8c82a9b5041109070999a03c83e54e.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: #fff; text-align: center; padding: 0 20px;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 2px; }

        /* Products Grid */
        .container { padding: 5rem 5%; max-width: 1200px; margin: auto; }
        .section-title { text-align: center; margin-bottom: 4rem; font-size: 2.2rem; font-weight: 400; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
        }
        .product-card {
            background: #fff; border: 1px solid #eee; transition: 0.4s;
        }

        /* Image Gallery System */
        .image-container { position: relative; width: 100%; height: 400px; overflow: hidden; }
        .product-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .product-img.active { display: block; }
        
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.7); border: none; padding: 10px;
            cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .nav-btn:hover { background: #fff; }
        .prev { left: 10px; }
        .next { right: 10px; }

        .product-info { padding: 2rem; text-align: center; }
        .product-info h3 { font-size: 1.3rem; margin-bottom: 0.5rem; font-weight: 400; }
        .product-price { color: var(--text-light); font-size: 1.1rem; margin-bottom: 1.5rem; }
        
        .buy-btn {
            display: inline-block; width: 100%; padding: 1rem;
            background: var(--primary-color); color: #fff;
            text-decoration: none; font-size: 0.9rem; letter-spacing: 2px;
            text-transform: uppercase; transition: 0.3s; cursor: pointer; border: none;
        }
        .buy-btn:hover { background: var(--accent-color); }

        footer { background: #f9f9f9; padding: 3rem 5%; text-align: center; border-top: 1px solid #eee; }
        .social-links a { color: var(--primary-color); margin: 0 15px; font-size: 1.2rem; }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="image/Untitled design (8).png" alt="Brand Logo">
        </div>
</header>

            ],

        }
    ];

    const productsContainer = document.getElementById('products');

    products.forEach((p, pIndex) => {
        let imagesHtml = '';
        p.images.forEach((img, i) => {
            imagesHtml += `<img src="${img}" class="product-img ${i === 0 ? 'active' : ''}" data-p="${pIndex}" data-i="${i}">`;
        });

        productsContainer.innerHTML += `
            <div class="product-card">
                <div class="image-container" id="gallery-${pIndex}">
                    ${imagesHtml}
                    <button class="nav-btn prev" onclick="changeImg(${pIndex}, -1)"><i class="fas fa-chevron-left"></i></button>
                    <button class="nav-btn next" onclick="changeImg(${pIndex}, 1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="product-info">
                    <h3>${p.name}</h3>
                    <p class="product-price">${p.price}</p>
                    <button class="buy-btn" onclick="window.open('${p.link}', '_blank')">Buy Now</button>
                </div>
            </div>
        `;
    });

    function changeImg(pIndex, direction) {
        const container = document.getElementById(`gallery-${pIndex}`);
        const images = container.querySelectorAll('.product-img');
        let activeIndex = 0;

        images.forEach((img, i) => {
            if(img.classList.contains('active')) activeIndex = i;
        });

        images[activeIndex].classList.remove('active');
        let nextIndex = activeIndex + direction;

        if(nextIndex >= images.length) nextIndex = 0;
        if(nextIndex < 0) nextIndex = images.length - 1;

        images[nextIndex].classList.add('active');
    }
</script>
